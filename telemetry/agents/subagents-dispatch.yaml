isfy, and terminology drift. Return a numbered list with quotes and severity. End with a Dissent: line."}]},{"group_id":"synthesizer","role":"synthesize","agents":[{"agent_name":"Noether, Emmy","role":"writer","model":"claude-fable-5","token_budget":4000,"initial_prompt":"From the explorers' initial returns and their robot-talks discussion, draft findings.md: dedupe, severity-rank, claim <= proof, every load-bearing claim cites the explorer return it rests on. Revise across zig-zag rounds with the reviewers until no objections remain (cap 3)."}]},{"group_id":"reviewers","role":"evaluate","n":2,"anti_bias":"attack vector: refute-the-finding (false-positive killer) vs find-the-missing (false-negative hunter)","agents":[{"agent_name":"Russell, Bertrand","role":"skeptic","model":"claude-fable-5","token_budget":3000,"angle":"refute each finding against the literal text of the skills and constitution; kill anything overstated","initial_prompt":"Per zig-zag round: take the synthesizer's draft, try to refute every finding against the literal documents. Raise objections with quotes; a round where you raise none terminates the exchange as converged."},{"agent_name":"Chalmers, David","role":"skeptic","model":"claude-fable-5","token_budget":3000,"angle":"hunt what the synthesis missed: inconsistencies present in the explorer material or the documents that did not survive into the draft","initial_prompt":"Per zig-zag round: take the synthesizer's draft plus the explorer material, hunt omissions and under-ranked findings. Raise objections with quotes; a round where you raise none terminates the exchange as converged."}]}]

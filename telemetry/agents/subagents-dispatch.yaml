ctor (conformidade-com-skill vs consistencia-com-lei vs usabilidade-engineer-view)","agents":[{"agent_name":null,"role":"skeptic","model":"claude-opus-4-8","token_budget":3000,"angle":"gate conformidade: invariantes do system-view/SKILL.md cumpridos um a um","initial_prompt":"Skeptic L3a. Gate unico: conformidade com .claude/skills/system-view/SKILL.md (leia INTEIRO). Audite invariante por invariante: objective-first gate, camadas com tabelas de framings, given-vs-optimized, what-this-view-does-not-cover, zero re-narracao proibida, anti-bias lifecycle, frontmatter. PASS/FAIL por invariante com cite. Numerado, Dissent: final."},{"agent_name":null,"role":"skeptic","model":"claude-opus-4-8","token_budget":3000,"angle":"gate lei-e-termos: nao redefine termos (defere a ontology-view) nem contradiz constituicao/discovery","initial_prompt":"Skeptic L3b. Gate unico: lei e vocabulario. A view redefine termo que pertence a ontology-view/constituicao/type skill? Contradiz a discovery v1.0.0 ou a constituicao v0.5.2? Trata emenda recomendada como vigente? Numerado com fonte exata. Dissent: final."},{"agent_name":null,"role":"skeptic","model":"claude-opus-4-8","token_budget":3000,"angle":"gate usabilidade: o engineer-view consegue construir o inventario 1:1 a partir do mapa de stances","initial_prompt":"Skeptic L3c. Gate unico: usabilidade para o engineer-view. Pegue o mapa de stances e simule: cada stance vira exatamente UMA row do inventario (verdict + status + autoridade citavel em disco)? Ha stance sem autoridade localizavel, stance dupla (duas decisoes num nome), decisao da discovery sem stance correspondente? Use a tabela verdict-para-status proposta na discovery §7. Numerado, Dissent: final."}]}]

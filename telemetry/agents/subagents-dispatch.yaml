    max_loops: 1
    final_approver: "parent"
    meta: true
    anti_bias_global: "autonomy optimism vs gate-integrity skepticism"
    working_folder: "research/subagents-strategy/2026-06-12-depth1-nested-dispatch-design/"
    groups: [{"group_id":"explorers","role":"investigate","n":2,"anti_bias":"source-corpus (external prior art vs internal constitutional lineage)","agents":[{"agent_name":"Abramsky, Samson","role":"explorer","angle":"owns the external side: prior art on bounding recursive delegation in multi-agent/actor/supervision systems","model":"claude-sonnet-4-6","token_budget":1200,"initial_prompt":"You are researching prior art for a governance design decision. CONTEXT: a constitution governing subagent dispatch (single human confirm gate before any dispatch; every dispatch recorded in an append-only ledger) is considering admitting DEPTH-1 NESTED DISPATCHES: a working agent may open at most one nested dispatch, max 2 per parent dispatch, and the nested dispatch may not nest further. TASK: survey how existing multi-agent systems, actor models, OS process supervision, and capability-based systems bound recursive delegation - e.g. supervision trees (Erlang/OTP), capability grants/attenuation, spawn quotas, fork bombs and rlimits, structured concurrency nurseries, sub-agent depth caps in agent frameworks. RETURN: a list of transferable patterns, each with: pattern name, system of origin, what it bounds (depth / width / cost / authority), how authorization is delegated in it, and a one-line fit assessment against a single-human-gate governance model. Prefer patterns with verifiable sources; cite them. Do not write any files - return text only. Budget ~1200 tokens. End with an explicit 'Dissent:' line stating where you expect the internal-lineage explorer (who derives constraints from the constitution itself) to disagree with you."},{"agent_name":"Baez, John","role":"explorer","angle":"owns the internal side: constraints derived from the constitution's own principles, premise debts, and lineage","model":"claude-opus-4-8","token_budget":1200,"initial_prompt":"You are deriving internal constraints for a governance design decision. CONTEXT: the repo's subagents-strategy constitution
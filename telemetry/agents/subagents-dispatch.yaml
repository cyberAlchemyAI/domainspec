    invoked_by: "victorboscaro@outlook.com"
    dispatch_type: "research"
    goal: "Decide whether and how to admit depth-1 nested dispatches: a working agent granted the right to open at most one nested dispatch, max 2 per parent, no further nesting - with the gate, registration, and budget questions answered."

    goal: "Decidir se 'rigor/exigencia do usuario' deve ser um INPUT HEURISTICO derivado no confirm gate (escalando n + token_budget + model, sem schema novo) ou um CAMPO de primeira classe no dispatch — ou se 'rigor' e o primitivo errado."
    context: "Repo domainspec, governanca de dispatch de subagentes (constituicao v0.5.2). Ja existem: n (L2 grupo), token_budget+model (L3 agente), dispatch_kind (presets single-lookup/flat-fanout/triangulation/adversarial-audit que ja escalam fan-out), e a clausula §5 'o humano pode fixar qualquer dial numerico'. A regra 'tres dials, um cenario um dial, menor escopo vence' limita adicionar alavancas. LEDGER-MODEL.md separa o plano de design/governanca do plano de custo (SQLite agents-telemetry). O owner propos manter 'rigor' como heuristica (sem campo). Avaliar se essa recomendacao sobrevive."
    max_loops: 1
    final_approver: "parent"
    anti_bias_global: "economia-de-usuario vs rigor-de-governanca: quando uma alavanca de operador serve uma necessidade real vs quando ela re-skina mecanismo existente ou legitima fan-out de baixo valor"
    working_folder: "research/subagents-strategy/2026-06-13-rigor-dial-proposal/"
    groups: [{"group_id":"explorers","role":"investigate","n":3,"robot_talks":true,"anti_bias":"methodology (parsimonia/minimalismo vs cibernetica/requisite-variety vs logica-de-decomposicao)","agents":[{"agent_name":"Wittgenstein, Ludwig","role":"explorer","model":"claude-sonnet-4-6","token_budget":900,"angle":"PARSIMONIA: o dial de rigor nao significa nada novo — ja e expresso por n + token_budget + model + dispatch_kind + a clausula pin-any-dial; adiciona-lo e estrutura supérflua. Defenda que a recomendacao heuristica (sem campo) e a unica honesta.","initial_prompt":"Voce e um explorer numa pesquisa adversarial de governanca de subagentes. CONTEXTO: repo domainspec, constituicao de dispatch v0.5.2. Ja existem os campos: n (agentes por grupo, nivel grupo), token_budget e model (por agente), o conceito dispatch_kind (presets que ja escalam o fan-out: single-lookup -> flat-fanout -> triangulation -> adversarial-audit), e a clausula §5 'o humano pode fixar qualquer dial numerico (max_loops, loop_cap, layers)'. Ha tambem a regra constitucional 'tres dials, tres escopos — um cenario, um dial; se dois parecem caber, o menor escopo vence'. PROPOSTA EM TESTE: adicionar um parametro de 'rigor/exigencia' que o usuario seta para escalar (a) quantos agentes e (b) token budget por agente, economizando em tarefas simples. O owner recomendou que isso seja um INPUT HEURISTICO derivado no confirm gate (o strategist propoe a planilha ja escalada; o humano confirma), NAO um campo de schema novo. SEU ANGULO (parsimonia/minimalismo): argumente que um campo novo de rigor e estrutura supérflua porque o efeito ja e inteiramente expressavel pelos campos existentes; que adicionar campo viola a regra 'um cenario, um dial'; e que a recomendacao heuristica e a unica honesta. Procure o caso mais forte CONTRA seu proprio angulo tambem. RETORNE (~900 tokens): (1) a tese do seu angulo em 1 frase; (2) 3-4 argumentos com o mecanismo concreto que cada um usa; (3) a evidencia/exemplo que ancora; (4) o contra-argumento mais forte que voce reconhece. TERMINE com uma linha 'Dissent:' nomeando onde voce preve discordar dos outros dois explorers (um cibernetico/requisite-variety, um de logica-de-decomposicao). Claim <= proof: nao afirme mais do que consegue ancorar."},{"agent_name":"Ashby, W. Ross","role":"explorer","model":"claude-sonnet-4-6","token_budget":900,"angle":"REQUISITE VARIETY: existe um gap real de controle de operador — os campos atuais exigem que o humano traduza intencao ('quero rapido/barato') em n+tokens, que ele nao tem intuicao para setar; uma alavanca de rigor de primeira classe e variedade requisitada legitima. Defenda que merece ser campo.","initial_prompt":"Voce e um explorer numa pesquisa adversarial de governanca de subagentes. CONTEXTO: repo domainspec, constituicao de dispatch v0.5.2. Ja existem os campos: n (agentes por grupo), token_budget e model (por agente), o conceito dispatch_kind (presets que escalam o fan-out: single-lookup/flat-fanout/triangulation/adversarial-audit), e a clausula §5 'o humano pode fixar qualquer dial numerico'. Regra constitucional: 'um cenario, um dial; o menor escopo vence'. PROPOSTA EM TESTE: adicionar um parametro de 'rigor/exigencia' que o usuario seta para escalar (a) numero de agentes e (b) token budget por agente, economizando em tarefas simples. O owner recomendou manter como INPUT HEURISTICO derivado no confirm gate, NAO campo novo. SEU ANGULO (cibernetica / lei da variedade requisitada de Ashby): argumente que existe um gap REAL de controle — o operador pensa em termos de intencao ('quero algo rapido e barato' vs 'quero exaustivo'), nao em n e token_budget; obrigar o humano a traduzir intencao em numeros que ele nao tem intuicao para calibrar e perda de variedade; uma alavanca de rigor de primeira classe da ao operador a variedade de controle que casa com a variedade do problema. Argumente que merece ser CAMPO (auditavel, default-avel), nao so heuristica efemera. Reconheca o contra-argumento mais forte (redundancia com dispatch_kind). RETORNE (~900 tokens): (1) tese em 1 frase; (2) 3-4 argumentos com mecanismo; (3) evidencia/exemplo ancora; (4) contra-argumento mais forte. TERMINE com linha 'Dissent:' nomeando onde preve discordar do explorer de parsimonia e do de decomposicao. Claim <= proof."},{"agent_name":"Ellerman, David","role":"explorer","model":"claude-sonnet-4-6","token_budget":900,"angle":"DECOMPOSICAO: 'rigor' e primitivo errado — colapsa dois eixos ortogonais (largura = n/perspectivas; profundidade = token_budget/model por agente); um escalar unico de rigor e erro de categoria, qualquer que seja a forma (campo ou heuristica). O eixo certo sao DOIS controles, nao um.","initial_prompt":"Voce e um explorer numa pesquisa adversarial de governanca de subagentes. CONTEXTO: repo domainspec, constituicao de dispatch v0.5.2. Campos existentes: n (agentes por grupo = LARGURA/perspectivas), token_budget e model por agente (= PROFUNDIDADE de cada agente), dispatch_kind (presets de forma de fan-out), clausula §5 'humano pode fixar qualquer dial'. PROPOSTA EM TESTE: um parametro unico de 'rigor/exigencia' que escala AO MESMO TEMPO (a) numero de agentes e (b) token budget por agente. O owner recomendou que seja heuristica no confirm gate, nao campo. SEU ANGULO (logica de decomposicao / particao): ataque o PRIMITIVO, nao a forma. Argumente que 'rigor' funde dois eixos ORTOGONAIS — largura (quantas perspectivas/agentes) e profundidade (quanto token/model por agente) — e que existem casos reais onde eles divergem: tarefa simples que precisa de UM agente FUNDO (1 agente, token alto); tarefa exigente que e MUITOS agentes RASOS (n alto, token baixo cada). Logo um escalar unico de rigor e erro de categoria, seja campo OU heuristica; o controle certo, se existir, sao DOIS dials (largura, profundidade) ou nenhum novo. Isso tensiona TANTO o defensor de campo unico QUANTO o de parsimonia. Reconheca o contra mais forte (na pratica largura e profundidade correlacionam, entao um proxy unico basta). RETORNE (~900 tokens): (1) tese em 1 frase; (2) 3-4 argumentos com mecanismo; (3) os 2 exemplos-testemunha onde os eixos divergem; (4) contra mais forte. TERMINE com linha 'Dissent:' nomeando onde preve discordar do de parsimonia e do cibernetico. Claim <= proof."}]},{"group_id":"synthesizer","role":"synthesize","agents":[{"agent_name":"Bourbaki, Nicolas","role":"writer","model":"claude-opus-4-8","token_budget":3500,"initial_prompt":"Voce e o synthesizer. Voce recebera as posicoes INICIAIS e FINAIS (pos robot_talks) dos tres explorers (parsimonia / requisite-variety / decomposicao) sobre a pergunta: 'rigor de usuario deve ser input heuristico no confirm gate, campo de schema novo, ou e primitivo errado?'. TAREFA: escrever findings.md (sintese citada) e research.md (retornos verbatim) em research/subagents-strategy/2026-06-13-rigor-dial-proposal/. REGRAS: (1) cada claim de peso CITA o retorno de explorer em que se apoia; (2) detecte COLAPSO — se as posicoes finais convergiram demais vs as iniciais, marque como falha de tensionamento, nao sucesso; (3) produza a MATRIZ DE VEREDITO por candidato (candidato | owned?/precedent | witnessed?/non-vacuity | sound?/definitional | verdict GO/KILL). Candidatos a avaliar: C1='rigor como heuristica no confirm gate (sem campo)', C2='rigor como campo de schema', C3='dois dials (largura+profundidade) em vez de um', C4='nenhum controle novo — dispatch_kind ja basta'. (4) claim <= proof: demote, nunca infle. Termine com a resposta de 1 linha ao goal. Voce sera atacado por dois skeptics (precedent-kill e non-vacuity) num zig-zag de ate 5 rodadas — escreva para sobreviver ao ataque, deixando explicito para cada keystone o fato que o zeraria."}]},{"group_id":"reviewers","role":"evaluate","n":2,"robot_talks":true,"anti_bias":"attack-vector (precedent-kill vs non-vacuity)","agents":[{"agent_name":"Tarski, Alfred","role":"skeptic","model":"claude-opus-4-8","token_budget":1500,"angle":"GATE precedent-kill: a recomendacao ja e DONA por mecanismo existente? Encontre o dono exato (dispatch_kind? a clausula pin-any-dial? a propria proposta do confirm gate?), nao algo 'parecido'.","initial_prompt":"Voce e um skeptic reviewer. GATE UNICO: precedent-kill. Voce recebera findings.md do synthesizer recomendando como tratar 'rigor de usuario' no dispatch de subagentes. CONTEXTO: ja existem dispatch_kind (presets que escalam fan-out: single-lookup/flat-fanout/triangulation/adversarial-audit), a clausula §5 'o humano pode fixar qualquer dial numerico', e o proprio confirm gate onde o strategist propoe a planilha. SUA TAREFA: tentar MATAR a recomendacao por precedente — mostre que ela ja e inteiramente DONA por um desses mecanismos (nomeie o dono exato e cite a clausula), tornando-a vacua/ja-feita; OU conceda, defendido, que ha residuo nao-coberto e nomeie exatamente qual. Nao aceite 'parecido' — ache o dono ou admita que nao ha. RETORNE (~1500 tokens): vereditos por candidato {UPHELD/REFUTED/DOWNGRADED->}, com o fato exato que sustenta cada um, e suas objecoes acionaveis ao synthesizer (o que ele precisa mudar para sobreviver). Termine com 'Dissent:' vs o skeptic de non-vacuity. Trust-but-verify: se o findings citar um campo/clausula, verifique que existe antes de aceitar."},{"agent_name":"Godel, Kurt","role":"skeptic","model":"claude-opus-4-8","token_budget":1500,"angle":"GATE non-vacuity: construir a menor testemunha concreta onde a recomendacao MUDA a planilha de fato (uma tarefa simples e uma exigente produzindo sheets diferentes), ou forcar um negativo fechado de que a heuristica nao faz trabalho real.","initial_prompt":"Voce e um skeptic reviewer. GATE UNICO: non-vacuity. Voce recebera findings.md do synthesizer recomendando como tratar 'rigor de usuario' no dispatch de subagentes (provavelmente: heuristica no confirm gate que escala n+token_budget+model). SUA TAREFA: a recomendacao faz TRABALHO REAL? Construa a MENOR testemunha concreta: pegue uma tarefa simples real e uma exigente real e mostre que a heuristica produz planilhas DIFERENTES e melhores do que o default atual — se conseguir, a recomendacao e nao-vacua; se NAO conseguir construir tal testemunha, force o negativo fechado: a 'heuristica' e hand-waving que so renomeia o que o strategist ja faz. Ataque tambem: a heuristica e reproduzivel/determinista ou depende de adivinhacao do strategist? RETORNE (~1500 tokens): vereditos por candidato {UPHELD/REFUTED/DOWNGRADED->} com a testemunha concreta (ou o negativo fechado) que sustenta cada um, e objecoes acionaveis ao synthesizer. Termine com 'Dissent:' vs o skeptic de precedent-kill. Claim <= proof."}]}]

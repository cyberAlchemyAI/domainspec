services:
  postgres:
    image: postgres:16
    container_name: domainspec-postgres-dev
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: domainspec
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d domainspec"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - domainspec_pg_data:/var/lib/postgresql/data

volumes:
  domainspec_pg_data:

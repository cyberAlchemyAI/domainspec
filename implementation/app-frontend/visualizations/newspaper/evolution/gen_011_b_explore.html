<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gen 011 B: Explore (Cyber Terminal)</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,600;1,400&family=IBM+Plex+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --text: #c9d1d9;
    --muted: #8b949e;
    --border: #30363d;
    --accent: #2ea043; /* Terminal Green */
    --accent-glow: rgba(46, 160, 67, 0.2);
    --font-ui: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }

  body {
    background: var(--bg); color: var(--text); font-family: var(--font-ui);
    margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden;
  }

  header { text-align: center; padding: 40px 20px 20px; border-bottom: 1px solid var(--border); background: var(--card); }
  header h1 { font-family: var(--font-mono); font-weight: 600; margin: 0 0 8px 0; font-size: 2rem; color: var(--text); letter-spacing: -1px; }
  header p { font-family: var(--font-mono); color: var(--accent); font-size: 0.85rem; margin: 0; text-transform: uppercase;}

  /* COMPONENT VOTE WIDGET (ATOMIC VOTE) */
  .obj-vote { display: inline-flex; gap: 4px; align-items: center; background: var(--bg); padding: 4px 12px; border-radius: 4px; border: 1px solid var(--border); font-family: var(--font-mono); font-size: 0.7rem; color: var(--muted); text-transform: uppercase;}
  .obj-vote button { background: transparent; border: 1px solid transparent; cursor: pointer; border-radius: 4px; transition: 0.2s; font-size: 1rem;}
  .obj-vote button:hover { border-color: var(--accent); }

  /* SIDE MENUS - CONSTITUTIONAL TRAIT */
  .side-drawer {
    position: fixed; top: 0; bottom: 0; width: 340px; background: var(--card);
    transition: transform 0.3s cubic-bezier(0.19, 1, 0.22, 1); z-index: 1000; border: 1px solid var(--border); box-shadow: 0 0 40px rgba(0,0,0,0.5);
  }
  .drawer-left { left: 0; transform: translateX(-100%); }
  .drawer-right { right: 0; transform: translateX(100%); }
  .drawer-active { transform: translateX(0); }

  /* FLOATING SYMBOLS INSTEAD OF BARS - CONSTITUTIONAL TRAIT */
  .trigger {
    position: fixed; top: 30px; width: 44px; height: 44px; background: var(--card); color: var(--muted); border: 1px solid var(--border); 
    display: flex; justify-content: center; align-items: center; cursor: pointer; z-index: 999;
    border-radius: 50%; transition: all 0.3s; font-size: 1.2rem; font-family: var(--font-mono); font-weight: 600;
  }
  .trigger:hover { color: var(--accent); border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
  .trigger-left { left: 20px; }
  .trigger-right { right: 20px; }

  .drawer-content { padding: 40px; }
  .drawer-title { font-family: var(--font-mono); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: var(--accent); margin-bottom: 24px; border-bottom: 1px solid var(--border); padding-bottom: 12px;}

  /* STATS PANEL - CONSTITUTIONAL TRAIT */
  .stat-item { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 12px; font-size: 0.85rem; font-family: var(--font-mono); }
  .stat-val { font-size: 1.2rem; color: var(--text); font-weight: 600; }
  .stat-bar { height: 2px; background: var(--border); margin-top: 4px; }
  .stat-fill { height: 100%; background: var(--accent); box-shadow: 0 0 8px var(--accent-glow);}

  /* THE READER */
  .pane-reader { padding: 60px 20px; max-width: 720px; margin: 0 auto; }
  
  /* READING LEVEL - CONSTITUTIONAL TRAIT */
  .level-controls { display: flex; justify-content: center; gap: 8px; margin-bottom: 60px; font-family: var(--font-mono); }
  .lvl-btn { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; font-size: 0.8rem; cursor: pointer; transition: 0.2s; border-radius: 4px; text-transform: uppercase;}
  .lvl-btn:hover { border-color: var(--accent); color: var(--text); }
  .lvl-btn.active { background: var(--accent-glow); color: var(--accent); border-color: var(--accent); }

  /* ARTICLES */
  .article-node { margin-bottom: 80px; }
  .article-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; font-family: var(--font-mono); border-bottom: 1px dashed var(--border); padding-bottom: 12px;}
  .article-tag { color: var(--text); background: var(--card); padding: 4px 12px; border: 1px solid var(--border); border-radius: 20px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
  .article-title { font-size: 2.2rem; font-weight: 700; line-height: 1.2; margin: 0 0 20px 0; color: #fff; }
  .article-body { font-size: 1.2rem; line-height: 1.7; color: var(--text); font-weight: 300;}
  .source-links { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
  .source-link { font-family: var(--mono, monospace); font-size: 0.7rem; color: var(--text-muted, #888); text-decoration: none; border: 1px dashed rgba(255,255,255,0.2); padding: 2px 8px; }
  .source-link:hover { color: var(--accent, #7c3aed); border-color: var(--accent, #7c3aed); }

  /* CONDITIONAL CONTENT */
  .content-exec, .content-tech, .content-graph { display: none; }
  body[data-level="exec"] .content-exec { display: block; }
  body[data-level="tech"] .content-exec, body[data-level="tech"] .content-tech { display: block; }
  body[data-level="graph"] .content-exec, body[data-level="graph"] .content-tech, body[data-level="graph"] .content-graph { display: block; }

  .tech-block { font-family: var(--font-mono); font-size: 0.95rem; background: var(--card); border: 1px solid #3b4252; padding: 24px; border-radius: 6px; margin: 24px 0; color: #88c0d0; }
  .graph-block { font-family: var(--font-mono); font-size: 0.85rem; color: #a3be8c; background: #2e3440; border-left: 3px solid var(--accent); padding: 20px; margin: 24px 0; }

  /* 8-AXIS VOTING GRID (Protocol v1.0.0) */
  .atomic-vote-panel { display: flex; flex-direction: column; gap: 16px; margin-top: 32px; padding-top: 24px; border-top: 1px dashed var(--border); }
  .vote-label { font-family: var(--font-mono); font-size: 0.70rem; font-weight: 700; color: var(--muted); text-transform: uppercase; }
  .eval-group { display: flex; flex-direction: column; margin-bottom: 12px; }
  .eval-row { display: flex; justify-content: space-between; align-items: center; }
  .vote-group { display: flex; gap: 4px; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; background: rgb(0 0 0 / 20%); }
  .vote-actions { margin-top: 8px; }
  .vote-btn-scale { border: none; background: transparent; color: var(--text); font-family: var(--font-mono); font-size: 0.80rem; padding: 4px 10px; cursor: pointer; border-right: 1px solid var(--border); font-weight: 700; transition: background-color 0.2s, color 0.2s; }
  .vote-btn-scale:last-child { border-right: none; }
  .vote-btn-scale:hover { background: var(--text); color: var(--bg); }
  .vote-btn-scale.active { background: var(--accent); color: var(--bg); }
  .vote-success-msg { font-family: var(--font-mono); font-size: 0.75rem; color: var(--accent); font-weight: 700; }

</style>
</head>
<body data-level="graph">

<header>
  <h1>ZefraHub // Graph Terminal</h1>
  <div style="display:flex; flex-direction:column; align-items:center; margin-top: 16px;">
    <p id="dateDisp" style="margin-bottom: 8px;">Loading...</p>
    <span class="vote-label" style="font-family: var(--font-mono); font-size: 0.70rem; font-weight: 700; color: var(--muted); text-transform: uppercase;">GLOBAL METRIC: GENERATION FITNESS</span>
    <div class="vote-group" id="vote_global_page" style="margin-top: 4px;"></div>
    <input type="text" class="comment-input" id="input_global_page" placeholder="Final Reason..." style="display:none; width: 250px; padding: 6px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 4px; font-family: var(--font-mono); font-size: 0.8rem; margin-top: 4px; outline: none;" onkeydown="if(event.key==='Enter') commitVote('global_fitness', null, 'vote_global_page')">
  </div>
</header>

<!-- TRIGGERS (FLOATING) -->
<div class="trigger trigger-left" id="trig-left">⌘</div>
<div class="trigger trigger-right" id="trig-right">⚡</div>

<!-- DRAWER LEFT -->
<nav class="side-drawer drawer-left" id="drawer-left">
  <div class="drawer-content">
    <div class="drawer-title">Index Buffer</div>
    <div id="nav-content" style="font-family: var(--font-mono); font-size: 0.9rem; line-height: 2.5; color: var(--text);">
      <!-- JS -->
    </div>
  </div>
</nav>

<!-- DRAWER RIGHT (STATS) -->
<aside class="side-drawer drawer-right" id="drawer-right">
  <div class="drawer-content">
    <div class="drawer-title">System Telemetry</div>
    
    <div style="margin-bottom: 30px;">
      <div class="stat-item"><span>Sessions Parsed</span> <span class="stat-val" id="st-sess">0</span></div>
      <div class="stat-bar"><div class="stat-fill" style="width: 85%"></div></div>
    </div>
    <div style="margin-bottom: 30px;">
      <div class="stat-item"><span>Decisions Committed</span> <span class="stat-val" id="st-dec">0</span></div>
      <div class="stat-bar"><div class="stat-fill" style="width: 40%"></div></div>
    </div>
    <div style="margin-bottom: 30px;">
      <div class="stat-item"><span>Specs Mutated</span> <span class="stat-val" id="st-spec">0</span></div>
      <div class="stat-bar"><div class="stat-fill" style="width: 20%"></div></div>
    </div>
  </div>
</aside>

<main class="pane-reader">
  
  <div class="level-controls">
    <button class="lvl-btn" onclick="setLevel('exec')">--exec</button>
    <button class="lvl-btn" onclick="setLevel('tech')">--tech</button>
    <button class="lvl-btn active" onclick="setLevel('graph')">--graph</button>
  </div>

  <div id="articles-container"></div>
  
</main>

<script>
  // MOCK DATABASE FOR EDITORIAL STYLE VOTING
  const mockPayload = {
    metadata: { date: "2026-03-24", stats: { sessions: 25, decisions: 12, specChanges: 8 } },
    articles: [
      { id: 'p1', tag: 'P1 • ACADEMIC STYLE', title: 'Integração de S. R. Ranganathan',
        body: '<p>A transição epistemológica do nosso Cofre de Conhecimento culminou hoje na adoção formal da Classificação Facetada.</p>',
        meta: { impact: 8.0, risk: "low", source_files: [] }
      }
    ]
  };

  let payload = (window.parent && window.parent.currentPayload) ? window.parent.currentPayload : mockPayload;

  if (payload && payload.articles) {
    document.getElementById('dateDisp').innerText = '[' + (payload.metadata ? payload.metadata.date : 'Unknown Date') + ']';
    document.getElementById('st-sess').innerText = payload.metadata && payload.metadata.stats ? payload.metadata.stats.sessions : 0;
    document.getElementById('st-dec').innerText = payload.metadata && payload.metadata.stats ? payload.metadata.stats.decisions : 0;
    document.getElementById('st-spec').innerText = payload.metadata && payload.metadata.stats ? payload.metadata.stats.specChanges : 0;

    let navHtml = ''; let artHtml = '';
    payload.articles.forEach(art => {
      navHtml += '<div><span style="color:var(--accent);">~</span> <a href="#' + art.id + '" style="color:var(--text); text-decoration:none;">' + art.title + '</a></div>';
      
      let bodyHtml = art.body || '';
      let sourceFiles = (art.meta && art.meta.source_files) || [];
      let sourceLinksHtml = sourceFiles.length ? '<div class="source-links">' + sourceFiles.map(function(f) {
        let name = f.split('/').pop();
        return '<a href="/api/doc?path=' + f + '" target="_blank" class="source-link">↗ ' + name + '</a>';
      }).join('') + '</div>' : '';

      artHtml += '<article class="article-node" id="' + art.id + '">' +
          '<div class="article-header">' +
            '<span class="article-tag">' + (art.tag || 'DYNAMIC') + '</span>' +
          '</div>' +
          '<h1 class="article-title">' + art.title + '</h1>' +
          '<div class="article-body">' +
            bodyHtml +
            sourceLinksHtml +
          '</div>' +
          
          '<div class="atomic-vote-panel">' +
            '<div class="vote-label">ATOMIC EVALUATORS</div>' +
            '<div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">' +
              '<!-- Left Column -->' +
              '<div style="display:flex; flex-direction:column; gap:12px;">' +
                '<div>' +
                  '<div class="eval-row"><span class="vote-label" style="font-size:0.7rem;">EDITORIAL DENSITY</span>' +
                    '<div class="vote-group" id="vote_den_' + art.id + '"></div>' +
                  '</div>' +
                  '<input type="text" class="comment-input" id="input_den_' + art.id + '" placeholder="Comment..." onkeydown="if(event.key===\'Enter\') commitVote(\'editorial_density\', \'' + art.id + '\', \'vote_den_' + art.id + '\')" style="display:none; width:100%; padding: 8px 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; font-family: var(--font-mono); font-size: 0.85rem; margin-top: 8px; outline: none;">' +
                '</div>' +
                '<div>' +
                  '<div class="eval-row"><span class="vote-label" style="font-size:0.7rem;">STRUCTURE</span>' +
                    '<div class="vote-group" id="vote_str_' + art.id + '"></div>' +
                  '</div>' +
                  '<input type="text" class="comment-input" id="input_str_' + art.id + '" placeholder="Comment..." onkeydown="if(event.key===\'Enter\') commitVote(\'structure\', \'' + art.id + '\', \'vote_str_' + art.id + '\')" style="display:none; width:100%; padding: 8px 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; font-family: var(--font-mono); font-size: 0.85rem; margin-top: 8px; outline: none;">' +
                '</div>' +
                '<div>' +
                  '<div class="eval-row"><span class="vote-label" style="font-size:0.7rem;">TONE</span>' +
                    '<div class="vote-group" id="vote_ton_' + art.id + '"></div>' +
                  '</div>' +
                  '<input type="text" class="comment-input" id="input_ton_' + art.id + '" placeholder="Comment..." onkeydown="if(event.key===\'Enter\') commitVote(\'tone\', \'' + art.id + '\', \'vote_ton_' + art.id + '\')" style="display:none; width:100%; padding: 8px 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; font-family: var(--font-mono); font-size: 0.85rem; margin-top: 8px; outline: none;">' +
                '</div>' +
                '<div>' +
                  '<div class="eval-row"><span class="vote-label" style="font-size:0.7rem;">FORM</span>' +
                    '<div class="vote-group" id="vote_for_' + art.id + '"></div>' +
                  '</div>' +
                  '<input type="text" class="comment-input" id="input_for_' + art.id + '" placeholder="Comment..." onkeydown="if(event.key===\'Enter\') commitVote(\'form\', \'' + art.id + '\', \'vote_for_' + art.id + '\')" style="display:none; width:100%; padding: 8px 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; font-family: var(--font-mono); font-size: 0.85rem; margin-top: 8px; outline: none;">' +
                '</div>' +
              '</div>' +
              '<!-- Right Column -->' +
              '<div style="display:flex; flex-direction:column; gap:12px;">' +
                '<div>' +
                  '<div class="eval-row"><span class="vote-label" style="font-size:0.7rem;">TOPOLOGY</span>' +
                    '<div class="vote-group" id="vote_top_' + art.id + '"></div>' +
                  '</div>' +
                  '<input type="text" class="comment-input" id="input_top_' + art.id + '" placeholder="Comment..." onkeydown="if(event.key===\'Enter\') commitVote(\'topology\', \'' + art.id + '\', \'vote_top_' + art.id + '\')" style="display:none; width:100%; padding: 8px 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; font-family: var(--font-mono); font-size: 0.85rem; margin-top: 8px; outline: none;">' +
                '</div>' +
                '<div>' +
                  '<div class="eval-row"><span class="vote-label" style="font-size:0.7rem;">VISUAL ENTROPY</span>' +
                    '<div class="vote-group" id="vote_vis_' + art.id + '"></div>' +
                  '</div>' +
                  '<input type="text" class="comment-input" id="input_vis_' + art.id + '" placeholder="Comment..." onkeydown="if(event.key===\'Enter\') commitVote(\'visual_entropy\', \'' + art.id + '\', \'vote_vis_' + art.id + '\')" style="display:none; width:100%; padding: 8px 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; font-family: var(--font-mono); font-size: 0.85rem; margin-top: 8px; outline: none;">' +
                '</div>' +
                '<div>' +
                  '<div class="eval-row"><span class="vote-label" style="font-size:0.7rem;">INTERACTION MECHANICS</span>' +
                    '<div class="vote-group" id="vote_int_' + art.id + '"></div>' +
                  '</div>' +
                  '<input type="text" class="comment-input" id="input_int_' + art.id + '" placeholder="Comment..." onkeydown="if(event.key===\'Enter\') commitVote(\'interaction_mechanics\', \'' + art.id + '\', \'vote_int_' + art.id + '\')" style="display:none; width:100%; padding: 8px 12px; border: 1px solid var(--border); background: var(--bg); color: var(--text); border-radius: 6px; font-family: var(--font-mono); font-size: 0.85rem; margin-top: 8px; outline: none;">' +
                '</div>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</article>';
    });
    document.getElementById('nav-content').innerHTML = navHtml;
    document.getElementById('articles-container').innerHTML = artHtml;
  } else {
    document.getElementById('articles-container').innerHTML = '<p>No data available</p>';
  }

  function setLevel(lvl) {
    document.body.setAttribute('data-level', lvl);
    document.querySelectorAll('.lvl-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
  }

  function setupDrawer(triggerId, drawerId) {
    const trigger = document.getElementById(triggerId);
    const drawer = document.getElementById(drawerId);
    let timeoutId;
    const openDrawer = () => { clearTimeout(timeoutId); drawer.classList.add('drawer-active'); };
    const closeDrawerWithDelay = () => { timeoutId = setTimeout(() => { drawer.classList.remove('drawer-active'); }, 3000); };
    trigger.addEventListener('mouseenter', openDrawer);
    drawer.addEventListener('mouseenter', openDrawer);
    trigger.addEventListener('mouseleave', closeDrawerWithDelay);
    drawer.addEventListener('mouseleave', closeDrawerWithDelay);
  }

  let pendingVotes = {};

  // Initialize the 1-5 scale buttons inside elements with class 'vote-group'
  function initVoteButtons() {
    document.querySelectorAll('.vote-group').forEach(container => {
      const id = container.id;
      const parts = id.replace('vote_', '').split('_');
      const articleId = parts.pop();
      const metricKey = parts.join('_');
      let metricName = metricKey;
      
      // Map shorthand to canonical names
      if (metricKey === 'den') metricName = 'editorial_density';
      else if (metricKey === 'str') metricName = 'structure';
      else if (metricKey === 'ton') metricName = 'tone';
      else if (metricKey === 'top') metricName = 'topology';
      else if (metricKey === 'vis') metricName = 'visual_entropy';
      else if (metricKey === 'int') metricName = 'interaction_mechanics';
      else if (metricKey === 'for') metricName = 'form';
      else if (metricKey === 'global') metricName = 'global_fitness';
      
      let btns = '';
      for (let n = 1; n <= 5; n++) {
        btns += `<button class="vote-btn-scale" onclick="registerVote('${metricName}', '${articleId === 'global' ? '' : articleId}', ${n}, '${id}')">${n}</button>`;
      }
      container.innerHTML = btns;
    });
  }

  function registerVote(metricName, articleId, score, blockId) {
    const container = document.getElementById(blockId);
    if(container && container.classList.contains('voted')) return; 

    if(container) {
      container.querySelectorAll('.vote-btn-scale').forEach(btn => {
        btn.classList.remove('active');
        if (parseInt(btn.innerText) === score) btn.classList.add('active');
      });
    }
    
    pendingVotes[blockId] = { metricName, articleId, score };
    
    const _commentId = blockId.replace('vote_', 'comment_');
    const inputEl = document.getElementById(blockId.replace('vote_', 'input_'));
    if(inputEl) {
      inputEl.style.display = 'block';
      inputEl.focus();
    }
  }

  function commitVote(metricName, articleId, blockId) {
    const state = pendingVotes[blockId];
    if(!state) return;
    
    const inputEl = document.getElementById(blockId.replace('vote_', 'input_'));
    const reason = inputEl ? inputEl.value : '';
    
    const container = document.getElementById(blockId);
    if(container) container.classList.add('voted');
    
    if (window.parent && window.parent.registerAtomicVote) {
      let componentContext = articleId ? `Article: ${articleId}` : 'Overall Page';
      window.parent.registerAtomicVote({
         metric_name: state.metricName,
         score: state.score,
         comment: reason ? `[${componentContext}] ${reason}` : `[${componentContext}] No comment`
      });
    }
    
    if(container) {
      container.innerHTML = `<span class="vote-success-msg" style="display:inline-block; margin-top:8px; font-family:var(--font-mono); font-size:0.75rem; color:#10b981; font-weight:700;">✓ SYNCED: ${state.score}/5</span>`;
    }
    if (inputEl) inputEl.style.display = 'none';
  }
  
  // Call initVoteButtons after the DOM is built
  initVoteButtons();

  setupDrawer('trig-left', 'drawer-left');
  setupDrawer('trig-right', 'drawer-right');

</script>
</body>
</html>

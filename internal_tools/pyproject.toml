[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "domainspec-internal-tools"
version = "0.1.0"
description = "Vault platform for /domainspec — shared kernel + subsystems"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "typer>=0.12",
    "PyYAML>=6.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "mypy>=1.7", "ruff>=0.1"]
graph-retrieval = ["networkx>=3.0", "sentence-transformers>=2.5", "numpy>=1.24"]

[project.scripts]
vault-ctl = "vault_ctl.cli:app"
vault-telemetry = "vault_telemetry.cli:app"
convergence-runner = "convergence_runner.cli:app"
categorical-tooling-guard = "categorical_tooling_guard.cli:main"
tower-explorer = "tower_explorer.cli:main"

[tool.setuptools.packages.find]
include = ["vault_common*", "vault_ctl*", "vault_telemetry*", "vault_governance*", "convergence_runner*", "graph_retrieval*", "categorical_tooling_guard*", "tower_explorer*"]

[tool.ruff]
line-length = 100
target-version = "py311"
